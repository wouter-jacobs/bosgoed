media:
  input: fotos
  output: /fotos

content:
  - name: producten
    label: Producten
    type: file
    path: data/producten.json
    format: json
    fields:
      - name: producten
        label: Producten
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titel}"
        fields:
          - name: titel
            label: Naam van het product
            type: string
            required: true
          - name: soort
            label: Categorieën
            description: "Kies een of meer categorieën. Een nieuwe categorie maak je eerst aan onder Categorieën in het menu."
            type: reference
            required: true
            options:
              collection: categorieen
              multiple: true
              search: "naam"
              value: "{naam}"
              label: "{naam}"
          - name: prijs
            label: Prijs
            description: "Bijvoorbeeld: vanaf € 5. Leeg laten = niet tonen"
            type: string
          - name: tekst
            label: Omschrijving
            type: text

  - name: galerij
    label: Inspiratie (foto's)
    type: file
    path: data/galerij.json
    format: json
    fields:
      - name: fotos
        label: Foto's
        description: "Deze foto's staan in de galerij bij Inspiratie, in deze volgorde. Sleep om te verplaatsen. Liggende foto's van 1600 × 1200 pixels werken het best."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{onderschrift}"
        fields:
          - name: foto
            label: Foto
            type: image
            required: true
          - name: onderschrift
            label: Onderschrift
            description: "Korte tekst onder de foto, bijvoorbeeld de naam van het product. Mag leeg blijven."
            type: string

  - name: categorieen
    label: Categorieën
    type: collection
    path: data/categorieen
    format: json
    filename: "{fields.naam}.json"
    fields:
      - name: naam
        label: Naam van de categorie
        description: "Deze naam komt als filterknop op de site zodra er een product in staat."
        type: string
        required: true

  - name: site
    label: Naam en contact
    type: file
    path: data/site.json
    format: json
    fields:
      - name: naam
        label: Naam
        type: string
      - name: plaats
        label: Plaats
        type: string
      - name: kvk
        label: KVK-nummer
        description: "Verschijnt onderaan de pagina. Leeg laten = niet tonen"
        type: string
      - name: over_foto
        label: Foto bij Over mij
        type: image
      - name: over_tekst
        label: Tekst bij Over mij
        type: text
      - name: email
        label: E-mailadres
        description: "Leeg laten = niet tonen"
        type: string
      - name: whatsapp
        label: WhatsApp-nummer
        description: "Bijvoorbeeld 0612345678. Leeg laten = niet tonen"
        type: string
      - name: instagram
        label: Instagram-naam
        description: "Zonder @"
        type: string

