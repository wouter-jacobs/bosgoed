media:
  input: fotos
  output: /fotos

content:
  - name: producten
    label: Producten
    type: file
    path: data/producten.json
    format: json
    fields:
      - name: producten
        label: Producten
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titel}"
        fields:
          - name: titel
            label: Naam van het product
            type: string
            required: true
          - name: soort
            label: Categorieën
            description: "Kies een of meer categorieën. Een nieuwe categorie maak je eerst aan onder Categorieën in het menu."
            type: reference
            required: true
            options:
              collection: categorieen
              multiple: true
              search: "naam"
              value: "{naam}"
              label: "{naam}"
          - name: prijs
            label: Prijs
            description: "Bijvoorbeeld: vanaf € 5. Leeg laten = niet tonen"
            type: string
          - name: tekst
            label: Omschrijving
            type: text
          - name: uitgebreid
            label: Uitgebreide tekst voor de productpagina
            description: "Optioneel. Staat alleen op de losse productpagina (bijv. bos-goed.nl/sleutelhangers). Leeg laten = de omschrijving hierboven wordt gebruikt."
            type: text
          - name: fotos
            label: Extra foto's voor de productpagina
            description: "Optioneel. Deze foto's komen alleen op de losse productpagina, niet in de galerij. Foto's uit de galerij met deze productnaam in het onderschrift komen er automatisch bij."
            type: image
            list: true

  - name: galerij
    label: Inspiratie (foto's)
    type: file
    path: data/galerij.json
    format: json
    fields:
      - name: fotos
        label: Foto's
        description: "Deze foto's staan in de galerij bij Inspiratie, in deze volgorde. Sleep om te verplaatsen. Liggende foto's van 1600 × 1200 pixels werken het best. Foutmelding 413 bij uploaden? Dan is de foto te groot: verklein hem eerst op bos-goed.nl/verklein."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{onderschrift}"
        fields:
          - name: foto
            label: Foto
            type: image
            required: true
          - name: onderschrift
            label: Onderschrift
            description: "Korte tekst onder de foto, bijvoorbeeld de naam van het product. Mag leeg blijven."
            type: string

  - name: categorieen
    label: Categorieën
    type: collection
    path: data/categorieen
    format: json
    filename: "{fields.naam}.json"
    fields:
      - name: naam
        label: Naam van de categorie
        description: "Deze naam komt als filterknop op de site zodra er een product in staat."
        type: string
        required: true

  - name: site
    label: Naam en contact
    type: file
    path: data/site.json
    format: json
    fields:
      - name: naam
        label: Naam
        type: string
      - name: plaats
        label: Plaats
        type: string
      - name: kvk
        label: KVK-nummer
        description: "Verschijnt onderaan de pagina. Leeg laten = niet tonen"
        type: string
      - name: over_foto
        label: Foto bij Over mij
        type: image
      - name: over_tekst
        label: Tekst bij Over mij
        type: text
      - name: email
        label: E-mailadres
        description: "Leeg laten = niet tonen"
        type: string
      - name: whatsapp
        label: WhatsApp-nummer
        description: "Bijvoorbeeld 0612345678. Leeg laten = niet tonen"
        type: string
      - name: instagram
        label: Instagram-naam
        description: "Zonder @"
        type: string
      - name: zakelijk_kop
        label: Zakelijk blok – kop
        description: "Het houtkleurige blok onder de producten"
        type: string
      - name: zakelijk_tekst
        label: Zakelijk blok – tekst
        description: "Leeg laten = blok niet tonen"
        type: text
      - name: zakelijk_pagina_tekst
        label: Zakelijke pagina – tekst
        description: "De tekst op bos-goed.nl/zakelijk/. Leeg laten = geen zakelijke pagina"
        type: text
      - name: zakelijk_fotos
        label: Zakelijke foto's
        description: "Foto's voor bos-goed.nl/zakelijk/. De eerste wordt de grote foto bovenaan. Daarna volgen passende foto's uit de galerij."
        type: image
        list: true

  - name: verzending
    label: Ophalen en verzenden
    type: file
    path: data/verzending.json
    format: json
    fields:
      - name: titel
        label: Titel van de pagina
        description: "Staat bovenaan de pagina en in het linkje onderaan de site"
        type: string
      - name: intro
        label: Inleiding
        type: text
      - name: kort
        label: In het kort
        description: "Het groene blok rechtsboven"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {waarde}"
        fields:
          - name: label
            label: Onderwerp
            type: string
          - name: waarde
            label: Tekst
            type: string
      - name: vragen
        label: Veelgestelde vragen
        description: "Bezoekers zien eerst alleen de vraag en klikken om het antwoord te openen"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{vraag}"
        fields:
          - name: vraag
            label: Vraag
            type: string
          - name: antwoord
            label: Antwoord
            type: text

  - name: voorwaarden
    label: Algemene voorwaarden
    type: file
    path: data/voorwaarden.json
    format: json
    fields:
      - name: titel
        label: Titel van de pagina
        type: string
      - name: intro
        label: Inleiding
        type: text
      - name: bijgewerkt
        label: Laatst bijgewerkt
        description: "Bijvoorbeeld: november 2026. Pas dit aan als je de voorwaarden wijzigt."
        type: string
      - name: artikelen
        label: Artikelen
        description: "De nummers (Artikel 1, 2, …) worden automatisch toegevoegd"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{kop}"
        fields:
          - name: kop
            label: Kop
            type: string
          - name: tekst
            label: Tekst
            description: "Een lege regel = nieuwe alinea"
            type: text
